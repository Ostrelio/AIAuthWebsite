name: Website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: test -f index.html && test -f styles.css && test -f main.js && test -f assets/logo.webp && test -f fonts/GeistPixel-Circle.woff2
